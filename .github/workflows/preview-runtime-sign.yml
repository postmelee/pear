name: Preview runtime signing

'on':
  push:
    branches: [codex/publish-task47]
    paths: ['.github/workflows/preview-runtime-sign.yml']
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful runtime reconstruction run ID
        required: true
        type: string
      source_sha:
        description: Reviewed reconstruction source commit
        required: true
        type: string
      provenance_sha256:
        description: Reviewed SHA-256 of reconstruction provenance.json
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: preview-runtime-signing
  cancel-in-progress: false

jobs:
  sign:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'postmelee/pear' &&
      github.ref == 'refs/heads/codex/publish-task47' &&
      vars.PEAR_SIGNING_APPROVED_SHA == github.sha
    runs-on: macos-26
    environment: pear-preview-signing
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      PEAR_BUILD_RUN: ${{ inputs.build_run }}
      PEAR_SOURCE_SHA: ${{ inputs.source_sha }}
      PEAR_PROVENANCE_SHA256: ${{ inputs.provenance_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Admit the exact reconstruction before loading signing credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PYTHON'
          import hashlib, json, os, re, shutil, subprocess, sys, tarfile
          from pathlib import Path
          sys.path.insert(0, 'preview')
          import runtime_build as rb
          import runtime_package as rp
          root = Path(os.environ['RUNNER_TEMP'])
          run_id, revision, digest = (os.environ[k] for k in
              ('PEAR_BUILD_RUN', 'PEAR_SOURCE_SHA', 'PEAR_PROVENANCE_SHA256'))
          if not re.fullmatch(r'[0-9]+', run_id) or not re.fullmatch(r'[0-9a-f]{40}', revision) or not re.fullmatch(r'[0-9a-f]{64}', digest):
              raise SystemExit('Invalid reviewed input identity')
          if shutil.disk_usage(root).free < 12 * 1024**3:
              raise SystemExit('Need 12 GiB free for immutable input, package and signing copies')
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/postmelee/pear/actions/runs/{run_id}']))
          if (run['conclusion'] != 'success' or run['head_sha'] != revision or
              run['head_branch'] != 'codex/publish-task47' or
              run['path'] != '.github/workflows/preview-runtime.yml'):
              raise SystemExit('Reconstruction run is not the reviewed successful workflow')
          inputs = root / 'pear-runtime-inputs'
          subprocess.run(['gh', 'run', 'download', run_id, '--repo', 'postmelee/pear',
              '--name', f'pear-runtime-unsigned-{revision}-{run["run_attempt"]}', '--dir', str(inputs)], check=True)
          provenance = inputs / 'provenance.json'
          if rb.sha256(provenance) != digest:
              raise SystemExit('Reconstruction provenance changed')
          record = json.loads(provenance.read_text())
          if record['source_revision'] != revision or str(record['run_id']) != run_id:
              raise SystemExit('Reconstruction source/run mismatch')
          for name, expected in record['files'].items():
              if Path(name).name != name or rb.sha256(inputs / name) != expected:
                  raise SystemExit('Reconstruction artifact checksum mismatch')
          validation = json.loads((inputs / 'validation.json').read_text())
          if validation['status'] != 'passed' or any(validation['checks']['browser_lifetime_' + a]['status'] != 'passed' for a in ('i386', 'x86_64')):
              raise SystemExit('Missing runtime lifecycle validation')
          raw = root / 'pear-runtime-raw'
          with tarfile.open(inputs / 'pear-runtime-unsigned.tar.gz') as archive:
              archive.extractall(raw, filter='data')
          # Exact c6a6c4d input lock; only the reviewed compiler notice refresh is allowed.
          # package() independently matches the complete immutable runtime inventory.
          rp.admit_notice_refresh(raw / 'Runtime/share/pear/runtime-inputs.json',
              '3f9f87501f3817ba685db9cc422d6a646b588117c9d52ffae72578a18de77da0')
          package = root / 'pear-runtime-integration.tar.gz'
          rp.package(raw / 'Runtime', inputs / 'runtime-manifest.json', package,
              baseline_sha256=record['files']['runtime-manifest.json'],
              runtime_id='pear-wine11-cw26.3-dxmt0.80-v3')
          with tarfile.open(package) as archive:
              archive.extractall(root / 'pear-runtime-integration', filter='data')
          subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'preview', '-p', 'test_runtime*.py'], check=True)
          PYTHON
      - name: Provision the approved identity in an isolated temporary keychain
        env:
          PEAR_CERTIFICATE_BASE64: ${{ secrets.PEAR_CERTIFICATE_BASE64 }}
          PEAR_CERTIFICATE_PASSWORD: ${{ secrets.PEAR_CERTIFICATE_PASSWORD }}
          PEAR_NOTARY_APPLE_ID: ${{ secrets.PEAR_NOTARY_APPLE_ID }}
          PEAR_NOTARY_PASSWORD: ${{ secrets.PEAR_NOTARY_PASSWORD }}
        run: |
          python3 -B - <<'PYTHON'
          import base64, os, secrets, subprocess
          from pathlib import Path
          os.umask(0o077)
          names = ('PEAR_CERTIFICATE_BASE64', 'PEAR_CERTIFICATE_PASSWORD', 'PEAR_NOTARY_APPLE_ID', 'PEAR_NOTARY_PASSWORD')
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Required protected environment credentials are missing')
          root = Path(os.environ['RUNNER_TEMP']) / 'pear-sign-credentials'
          root.mkdir(mode=0o700)
          keychain, certificate = root / 'signing.keychain-db', root / 'identity.p12'
          password = secrets.token_urlsafe(32)
          def quiet(*args):
              # Never log credential-bearing arguments or command diagnostics.
              result = subprocess.run(args, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if result.returncode:
                  raise RuntimeError('Private credential provisioning failed; review the configured identity and Apple account')
          try:
              certificate.write_bytes(base64.b64decode(os.environ['PEAR_CERTIFICATE_BASE64'], validate=True))
              quiet('/usr/bin/security', 'create-keychain', '-p', password, str(keychain))
              quiet('/usr/bin/security', 'set-keychain-settings', '-lut', '3600', str(keychain))
              quiet('/usr/bin/security', 'unlock-keychain', '-p', password, str(keychain))
              quiet('/usr/bin/security', 'import', str(certificate), '-P', os.environ['PEAR_CERTIFICATE_PASSWORD'],
                    '-k', str(keychain), '-T', '/usr/bin/codesign')
              quiet('/usr/bin/security', 'set-key-partition-list', '-S', 'apple-tool:,apple:', '-s', '-k', password, str(keychain))
              # Match the hosted macOS recipe: codesign needs search-list admission.
              quiet('/usr/bin/security', 'list-keychains', '-d', 'user', '-s', str(keychain))
              quiet('/usr/bin/xcrun', 'notarytool', 'store-credentials', 'pear-ci-notary', '--keychain', str(keychain),
                    '--apple-id', os.environ['PEAR_NOTARY_APPLE_ID'], '--team-id', 'XH6JHKYXV8',
                    '--password', os.environ['PEAR_NOTARY_PASSWORD'])
          except Exception:
              raise SystemExit('Private credential provisioning failed; no credential diagnostics are retained') from None
          finally:
              certificate.unlink(missing_ok=True)
          PYTHON
      - name: Sign and notarize only the admitted runtime
        env:
          PEAR_CERTIFICATE_SHA1: ${{ vars.PEAR_CERTIFICATE_SHA1 }}
        run: |
          python3 -B preview/runtime_sign.py \
            --libraries "$RUNNER_TEMP/pear-runtime-integration/Libraries" \
            --manifest "$RUNNER_TEMP/pear-runtime-integration.tar.json" \
            --output "$RUNNER_TEMP/pear-runtime-signed" \
            --identity "$PEAR_CERTIFICATE_SHA1"
          ditto -c -k --keepParent "$RUNNER_TEMP/pear-runtime-signed/Libraries" "$RUNNER_TEMP/pear-runtime-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/pear-runtime-notary.zip" \
            --keychain-profile pear-ci-notary \
            --keychain "$RUNNER_TEMP/pear-sign-credentials/signing.keychain-db" \
            --wait --output-format json > "$RUNNER_TEMP/pear-runtime-notarization.json"
          python3 -B - <<'PYTHON'
          import json, os, shutil, sys, tarfile
          from pathlib import Path
          sys.path.insert(0, 'preview')
          import runtime_build as rb
          import runtime_package as rp
          root = Path(os.environ['RUNNER_TEMP'])
          notary = json.loads((root / 'pear-runtime-notarization.json').read_text())
          if notary.get('status') != 'Accepted':
              raise SystemExit('Runtime notarization not accepted')
          out = root / 'pear-runtime-release-candidate'
          out.mkdir()
          signed = root / 'pear-runtime-signed'
          rp.package_signed(signed / 'Libraries', signed / 'signing.json',
              rb.sha256(signed / 'signing.json'), out / 'pear-runtime-signed-v3.tar.gz',
              runtime_id='pear-wine11-cw26.3-dxmt0.80-signed-v3')
          source = root / 'pear-runtime-inputs/pear-runtime-source-kit.tar.gz'
          lock = json.loads(Path('preview/runtime-inputs.json').read_text())
          wanted = {'inputs/' + pin['filename'] for pin in lock['inputs'].values()}
          with tarfile.open(source) as archive:
              members = [m for m in archive.getmembers() if m.name in wanted]
              if len(members) != len(wanted) or any(not m.isfile() for m in members):
                  raise SystemExit('Source input allowlist mismatch')
              archive.extractall(root / 'pear-runtime-source-inputs', members=members, filter='data')
          mapping = {name: str(root / 'pear-runtime-source-inputs/inputs' / pin['filename'])
                     for name, pin in lock['inputs'].items()}
          inputs = rb.verify_inputs(mapping, lock)
          rb.source_kit(out / 'pear-runtime-source-kit-v3.tar.gz', inputs, lock)
          for name in ('signing.json', 'runtime-manifest.json'):
              shutil.copy2(signed / name, out / name)
          shutil.copy2(root / 'pear-runtime-notarization.json', out / 'notarization.json')
          for name in ('toolchain.json', 'validation.json', 'provenance.json'):
              shutil.copy2(root / 'pear-runtime-inputs' / name, out / ('reconstruction-' + name))
          record = dict(signing_source_revision=os.environ['GITHUB_SHA'],
              reconstruction_source_revision=os.environ['PEAR_SOURCE_SHA'],
              reconstruction_run=os.environ['PEAR_BUILD_RUN'],
              reconstruction_provenance_sha256=os.environ['PEAR_PROVENANCE_SHA256'],
              signing_run=os.environ['GITHUB_RUN_ID'], public_release=False,
              scope='Signed and notarized runtime candidate; local Steam/game verification remains required',
              files={p.name: rb.sha256(p) for p in sorted(out.iterdir()) if p.is_file()})
          (out / 'provenance.json').write_text(json.dumps(record, indent=2) + '\n')
          PYTHON
      - name: Remove the job-owned credentials on every outcome
        if: ${{ always() }}
        run: |
          python3 -B - <<'PYTHON'
          import os, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'pear-sign-credentials'
          keychain = root / 'signing.keychain-db'
          if keychain.exists():
              subprocess.run(['/usr/bin/security', 'delete-keychain', str(keychain)], check=True,
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          if root.exists():
              shutil.rmtree(root)
          PYTHON
      - name: Retain only the signed runtime and corresponding sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pear-runtime-signed-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pear-runtime-release-candidate/
          if-no-files-found: error
          retention-days: 7

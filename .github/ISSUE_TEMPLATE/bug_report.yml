name: Bug report
description: Report a reproducible problem with Pear.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: "For game observations use Show and tell. For vulnerabilities use SECURITY.md. Never attach passwords, QR codes, whole prefixes, game files or raw logs."
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include what you tried and the sanitized visible error.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Pear version or commit, Mac chip, macOS version, runtime versions if known, and affected game/build. Write unknown when needed.
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Execution path
      options:
        - Rosetta Preview
        - Rosetta-free development setup
        - Documentation or portable tooling
        - Unknown
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I searched existing reports and removed private data from this report.
          required: true
